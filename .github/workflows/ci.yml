name: Pokrov CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run --no-sync ruff check src tests

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src tests

      - name: Mypy strict type check
        run: uv run --no-sync mypy src

      - name: Pytest with coverage
        run: uv run --no-sync pytest -v --cov=pokrov --cov-report=term-missing
